[project]
name = "topinspect"
version = "0.1.0"
description = "Self-supervised GNN for Network Intrusion Detection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch==2.5.1",
    "torch-geometric==2.7.0",
    "torchaudio==2.5.1",
    "torchvision==0.20.1",
    "pyg_lib",
    "torch-sparse",     # PyG sparse operators
    "torch-scatter",    # PyG scatter operators
    "scikit-learn>=1.7.2",
    "pyod>=2.0.0",
    "numpy>=2.3.4",
    "scipy>=1.16.3",
    "pandas>=2.3.3",
    "pytest>=8.0.0",
    "wandb>=0.22.3",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.0.0",
    "ruff>=0.14.0",
    "ty",
]

# The locked dependency set currently targets Windows.
[tool.uv]
environments = ["sys_platform == 'win32'"]

[tool.uv.sources]
# PyTorch CUDA 12.4 wheels.
torch = [ { index = "pytorch-cu124" } ]
torchvision = [ { index = "pytorch-cu124" } ]
torchaudio = [ { index = "pytorch-cu124" } ]

# PyG extension wheels matching torch 2.5.1 + cu124.
pyg_lib = [ { index = "pyg" } ]
torch-sparse = [ { index = "pyg" } ]
torch-scatter = [ { index = "pyg" } ]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pyg"
url = "https://data.pyg.org/whl/torch-2.5.1+cu124.html"
format = "flat"
explicit = true

[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "C4", "SIM",
]
ignore = [
    "E501",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore:`torch_geometric\\.distributed` has been deprecated since 2\\.7\\.0:DeprecationWarning",
    "ignore:Failing to pass a value to the 'type_params' parameter of 'typing\\._eval_type' is deprecated:DeprecationWarning",
    "ignore:The PyTorch API of nested tensors is in prototype stage:UserWarning",
]
